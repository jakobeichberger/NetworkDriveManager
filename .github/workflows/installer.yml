name: Build Installers

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="1.0.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore NetworkDriveManager/NetworkDriveManager/NetworkDriveManager.csproj

      - name: Publish self-contained
        run: >
          dotnet publish NetworkDriveManager/NetworkDriveManager/NetworkDriveManager.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output ./publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}

      - name: Copy update script
        run: copy installers\update.ps1 .\publish\

      - name: Build Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
        with:
          path: installers/innosetup/setup.iss
          options: /DMyAppVersion=${{ steps.version.outputs.version }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: NetworkDriveManager-Setup-windows
          path: installers/innosetup/NetworkDriveManager-Setup-${{ steps.version.outputs.version }}.exe

  build-macos-installer:
    strategy:
      matrix:
        include:
          - rid: osx-x64
            arch: x64
          - rid: osx-arm64
            arch: arm64
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="1.0.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore NetworkDriveManager/NetworkDriveManager/NetworkDriveManager.csproj

      - name: Publish self-contained
        run: >
          dotnet publish NetworkDriveManager/NetworkDriveManager/NetworkDriveManager.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output ./publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}

      - name: Copy installer scripts
        run: |
          cp installers/install-macos.sh ./publish/
          cp installers/uninstall-macos.sh ./publish/
          cp installers/update-macos.sh ./publish/
          chmod +x ./publish/install-macos.sh
          chmod +x ./publish/uninstall-macos.sh
          chmod +x ./publish/update-macos.sh
          chmod +x ./publish/NetworkDriveManager

      - name: Create DMG
        run: |
          mkdir -p dmg-content
          cp -R ./publish/* dmg-content/
          hdiutil create -volname "NetworkDriveManager" \
            -srcfolder dmg-content \
            -ov -format UDZO \
            "NetworkDriveManager-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.dmg"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7
        with:
          name: NetworkDriveManager-macos-${{ matrix.arch }}-dmg
          path: NetworkDriveManager-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.dmg

  build-linux-installer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="1.0.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore NetworkDriveManager/NetworkDriveManager/NetworkDriveManager.csproj

      - name: Publish self-contained
        run: >
          dotnet publish NetworkDriveManager/NetworkDriveManager/NetworkDriveManager.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --output ./publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}

      - name: Copy installer scripts
        run: |
          cp installers/install-linux.sh ./publish/
          cp installers/uninstall-linux.sh ./publish/
          cp installers/update-linux.sh ./publish/
          chmod +x ./publish/install-linux.sh
          chmod +x ./publish/uninstall-linux.sh
          chmod +x ./publish/update-linux.sh
          chmod +x ./publish/NetworkDriveManager

      - name: Build DEB package
        run: |
          VERSION=${{ steps.version.outputs.version }}
          PKG_DIR="networkdrivemanager_${VERSION}_amd64"
          mkdir -p "$PKG_DIR/DEBIAN"
          mkdir -p "$PKG_DIR/opt/NetworkDriveManager"
          mkdir -p "$PKG_DIR/usr/share/applications"
          mkdir -p "$PKG_DIR/usr/local/bin"

          # Control file
          cat > "$PKG_DIR/DEBIAN/control" << EOF
          Package: networkdrivemanager
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: cifs-utils, libice6, libsm6, libx11-6, libfontconfig1
          Maintainer: NetworkDriveManager <support@networkdrivemanager.dev>
          Description: Network Drive Manager
           A cross-platform application for managing SMB/CIFS network drive connections.
           Supports connecting, disconnecting, and monitoring network drives with
           an intuitive graphical user interface.
          EOF
          # Remove leading spaces from heredoc
          sed -i 's/^          //' "$PKG_DIR/DEBIAN/control"

          # Post-install script
          cat > "$PKG_DIR/DEBIAN/postinst" << 'EOF'
          #!/bin/bash
          ln -sf /opt/NetworkDriveManager/NetworkDriveManager /usr/local/bin/networkdrivemanager
          update-desktop-database /usr/share/applications/ 2>/dev/null || true
          EOF
          sed -i 's/^          //' "$PKG_DIR/DEBIAN/postinst"
          chmod 755 "$PKG_DIR/DEBIAN/postinst"

          # Pre-removal script
          cat > "$PKG_DIR/DEBIAN/prerm" << 'EOF'
          #!/bin/bash
          rm -f /usr/local/bin/networkdrivemanager
          EOF
          sed -i 's/^          //' "$PKG_DIR/DEBIAN/prerm"
          chmod 755 "$PKG_DIR/DEBIAN/prerm"

          # Copy application files
          cp -R ./publish/* "$PKG_DIR/opt/NetworkDriveManager/"
          rm -f "$PKG_DIR/opt/NetworkDriveManager/install-linux.sh"
          rm -f "$PKG_DIR/opt/NetworkDriveManager/uninstall-linux.sh"

          # Desktop file
          cat > "$PKG_DIR/usr/share/applications/networkdrivemanager.desktop" << EOF
          [Desktop Entry]
          Name=Network Drive Manager
          Comment=Manage SMB/CIFS network drive connections
          Exec=/opt/NetworkDriveManager/NetworkDriveManager
          Terminal=false
          Type=Application
          Categories=System;Network;FileManager;
          StartupNotify=true
          EOF
          sed -i 's/^          //' "$PKG_DIR/usr/share/applications/networkdrivemanager.desktop"

          dpkg-deb --build "$PKG_DIR"

      - name: Upload DEB package
        uses: actions/upload-artifact@v7
        with:
          name: NetworkDriveManager-linux-deb
          path: networkdrivemanager_${{ steps.version.outputs.version }}_amd64.deb

      - name: Upload Linux archive with update script
        run: |
          cd ./publish && tar -czf ../NetworkDriveManager-linux-x64-installer.tar.gz .
        
      - name: Upload Linux installer archive
        uses: actions/upload-artifact@v7
        with:
          name: NetworkDriveManager-linux-installer
          path: NetworkDriveManager-linux-x64-installer.tar.gz

  release-installers:
    needs: [build-windows-installer, build-macos-installer, build-linux-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.tar.gz
