name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: NetworkDriveManager-windows-x64
            installer_script: install.ps1
            uninstaller_script: uninstall.ps1
          - os: macos-latest
            rid: osx-x64
            artifact: NetworkDriveManager-macos-x64
            installer_script: install-macos.sh
            uninstaller_script: uninstall-macos.sh
          - os: macos-latest
            rid: osx-arm64
            artifact: NetworkDriveManager-macos-arm64
            installer_script: install-macos.sh
            uninstaller_script: uninstall-macos.sh
          - os: ubuntu-latest
            rid: linux-x64
            artifact: NetworkDriveManager-linux-x64
            installer_script: install-linux.sh
            uninstaller_script: uninstall-linux.sh

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.0.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore NetworkDriveManager/NetworkDriveManager/NetworkDriveManager.csproj

      - name: Build
        run: dotnet build NetworkDriveManager/NetworkDriveManager/NetworkDriveManager.csproj --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Publish self-contained
        run: >
          dotnet publish NetworkDriveManager/NetworkDriveManager/NetworkDriveManager.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output ./publish/${{ matrix.artifact }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}

      - name: Include installer scripts
        shell: bash
        run: |
          cp installers/${{ matrix.installer_script }} ./publish/${{ matrix.artifact }}/
          cp installers/${{ matrix.uninstaller_script }} ./publish/${{ matrix.artifact }}/

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path ./publish/${{ matrix.artifact }}/* -DestinationPath ./${{ matrix.artifact }}.zip

      - name: Archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./publish/${{ matrix.artifact }}/${{ matrix.installer_script }}
          chmod +x ./publish/${{ matrix.artifact }}/${{ matrix.uninstaller_script }}
          cd ./publish && tar -czf ../${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
